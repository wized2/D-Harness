name: DeepEase Build & Release

on:
  push:
    branches: [deepease]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/dharness-release.jks"
            echo "Keystore OK: $(wc -c < "$GITHUB_WORKSPACE/dharness-release.jks") bytes"
          else
            echo "WARNING: no keystore secret"
          fi

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -f "$GITHUB_WORKSPACE/dharness-release.jks" ]; then
            export RELEASE_STORE_FILE="$GITHUB_WORKSPACE/dharness-release.jks"
            echo "RELEASE_STORE_FILE=$RELEASE_STORE_FILE"
          else
            echo "WARNING: building without release keystore — debug sign"
          fi
          gradle :app:assembleRelease --no-daemon --stacktrace
          find app/build/outputs -name '*.apk' -ls

      - name: Read version
        id: ver
        run: |
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          # Separate tag namespace so DeepEase does not collide with D-Harness vX.Y.Z
          echo "tag=deepease-v$VN" >> "$GITHUB_OUTPUT"
          echo "DeepEase version=$VN tag=deepease-v$VN"

      - name: Setup Android build-tools (apksigner/zipalign)
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.0

      - name: Prepare, align, verify APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$SRC"
          echo "SRC=$SRC"

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AS=$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1)
          ZA=$(find "$SDK/build-tools" -name zipalign | sort -V | tail -1)
          test -x "$AS" && test -x "$ZA"

          if [ -f "$GITHUB_WORKSPACE/dharness-release.jks" ] && [ -n "${RELEASE_STORE_PASSWORD:-}" ]; then
            ALIGNED="$GITHUB_WORKSPACE/aligned.apk"
            SIGNED="$GITHUB_WORKSPACE/signed.apk"
            "$ZA" -f -p 4 "$SRC" "$ALIGNED"
            "$AS" sign \
              --ks "$GITHUB_WORKSPACE/dharness-release.jks" \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass "pass:$RELEASE_STORE_PASSWORD" \
              --key-pass "pass:$RELEASE_KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$SIGNED" \
              "$ALIGNED"
            SRC="$SIGNED"
          fi

          "$AS" verify --verbose --print-certs "$SRC" | tee /tmp/apk-verify.txt
          grep -q '^Verifies$' /tmp/apk-verify.txt

          OUT="dist/DeepEase-${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "$OUT"
          ls -la dist/
          echo "APK ready: $OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepEase-release
          path: dist/*.apk

      - name: Release notes body
        id: notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            {
              echo 'body<<NOTES_EOF'
              cat RELEASE_NOTES.md
              echo
              echo 'NOTES_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'body<<NOTES_EOF'
              echo "## DeepEase ${{ steps.ver.outputs.name }}"
              echo
              echo "Everyday DeepSeek assistant (signed APK)."
              echo 'NOTES_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DeepEase ${{ steps.ver.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          files: dist/DeepEase-${{ steps.ver.outputs.name }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
