name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/dharness-release.jks"
            echo "Keystore OK: $(wc -c < "$GITHUB_WORKSPACE/dharness-release.jks") bytes"
          else
            echo "WARNING: no keystore secret"
          fi

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -f "$GITHUB_WORKSPACE/dharness-release.jks" ]; then
            export RELEASE_STORE_FILE="$GITHUB_WORKSPACE/dharness-release.jks"
          fi
          gradle :app:assembleRelease --no-daemon --stacktrace
          find app/build/outputs -name '*.apk' -ls

      - name: Read version
        id: ver
        run: |
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "tag=v$VN" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: |
          mkdir -p dist
          SRC=$(find app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$SRC"
          cp "$SRC" "dist/D-Harness-${{ steps.ver.outputs.name }}.apk"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: D-Harness-release
          path: dist/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: D-Harness ${{ steps.ver.outputs.name }}
          body: |
            ## D-Harness ${{ steps.ver.outputs.name }} (signed)

            DeepSeek Chat WebView shell with **Tool Shim v7.6.0-stable** + native bridge.

            ### Highlights
            - Auto-inject with multi-retry (stable session / no infinite TOOL_RESULT loops)
            - Native tools: memory, files, HTTP (no CORS), device, clipboard, share
            - Durable tool dedupe across reloads

            ### Install
            Download **D-Harness-${{ steps.ver.outputs.name }}.apk** below.

            MIT · offline-friendly private storage
          files: dist/D-Harness-${{ steps.ver.outputs.name }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
