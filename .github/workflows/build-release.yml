name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute
        run: chmod +x gradlew || true

      - name: Build release APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon
          else
            gradle :app:assembleRelease --no-daemon
          fi

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found $APK"
          ls -la app/build/outputs/apk || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: D-Harness-release
          path: app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: D-Harness v1.0.0
          body: |
            ## D-Harness 1.0.0

            - DeepSeek Chat WebView shell
            - Tool Shim **v6.2.0** auto-injected (FAB, tagline, dedupe, tools)
            - Native bridge: memory, fs, fetch (no CORS), clipboard, share, toast, vibrate
            - White-on-black DeepSeek adaptive icon

            Install the release APK below. Open a chat and paste your agent system prompt once.
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
