name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/dharness-release.jks"
            echo "Keystore OK: $(wc -c < "$GITHUB_WORKSPACE/dharness-release.jks") bytes"
          else
            echo "WARNING: no keystore secret"
          fi

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -f "$GITHUB_WORKSPACE/dharness-release.jks" ]; then
            export RELEASE_STORE_FILE="$GITHUB_WORKSPACE/dharness-release.jks"
            echo "RELEASE_STORE_FILE=$RELEASE_STORE_FILE"
            echo "alias set: ${RELEASE_KEY_ALIAS:+yes}"
          else
            echo "WARNING: building without release keystore — will use debug sign"
          fi
          gradle :app:assembleRelease --no-daemon --stacktrace
          find app/build/outputs -name '*.apk' -ls

      - name: Read version
        id: ver
        run: |
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "tag=v$VN" >> "$GITHUB_OUTPUT"

      - name: Setup Android build-tools (apksigner/zipalign)
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.0

      - name: Prepare, align, verify APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$SRC"
          echo "Using APK: $SRC ($(wc -c < "$SRC") bytes)"

          BT=$(find "${ANDROID_HOME:-$HOME/Android/Sdk}/build-tools" -type d -name '35*' | sort | tail -1)
          if [ -z "$BT" ]; then BT=$(ls -d "${ANDROID_HOME:-$HOME/Android/Sdk}/build-tools"/* | sort -V | tail -1); fi
          AS="$BT/apksigner"
          ZA="$BT/zipalign"
          echo "build-tools: $BT"

          # Re-sign with v1+v2+v3 so every installer path accepts the package
          if [ -f "$GITHUB_WORKSPACE/dharness-release.jks" ]; then
            ALIGNED="$GITHUB_WORKSPACE/aligned.apk"
            SIGNED="$GITHUB_WORKSPACE/signed.apk"
            "$ZA" -f -p 4 "$SRC" "$ALIGNED"
            "$AS" sign               --ks "$GITHUB_WORKSPACE/dharness-release.jks"               --ks-key-alias "$RELEASE_KEY_ALIAS"               --ks-pass "pass:$RELEASE_STORE_PASSWORD"               --key-pass "pass:$RELEASE_KEY_PASSWORD"               --v1-signing-enabled true               --v2-signing-enabled true               --v3-signing-enabled true               --out "$SIGNED"               "$ALIGNED"
            SRC="$SIGNED"
          fi

          "$AS" verify --verbose --print-certs "$SRC" | tee /tmp/apk-verify.txt
          grep -q '^Verifies$' /tmp/apk-verify.txt
          grep -E 'Verified using v2 scheme.*true' /tmp/apk-verify.txt

          # Fail if still looks unsigned for v1+v2 both false
          if grep -q 'Verified using v1 scheme (JAR signing): false' /tmp/apk-verify.txt              && grep -q 'Verified using v2 scheme (APK Signature Scheme v2): false' /tmp/apk-verify.txt; then
            echo "FATAL: no usable APK signature"
            exit 1
          fi

          OUT="dist/D-Harness-${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "$OUT"
          ls -la dist/
          echo "APK ready: $OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: D-Harness-release
          path: dist/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: D-Harness ${{ steps.ver.outputs.name }}
          body: |
            ## D-Harness ${{ steps.ver.outputs.name }} (signed)

            DeepSeek Chat WebView + **tool shim** + **native bridge**.

            ### Agent
            - Paste-ready system instructions in-app
            - `list_tools()` / `describe()` with examples — no guessing tool APIs
            - One JSON tool call per reply → `TOOL_RESULT:` → continue

            ### Stack
            - Shim: upstream dsh.js + native tools
            - Theme: Claude.js v3.1 (optional)
            - Logo: updated brand SVG

            ### Install
            Download **D-Harness-${{ steps.ver.outputs.name }}.apk** below.

            MIT

          files: dist/D-Harness-${{ steps.ver.outputs.name }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
