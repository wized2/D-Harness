name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: D-Harness-release
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: D-Harness v1.0.0
          body: |
            ## D-Harness 1.0.0
            - DeepSeek Chat WebView shell
            - Tool Shim **v6.2.0** (draggable FAB, native-style tagline, dedupe)
            - Native bridge: memory, fs, fetch (no CORS), clipboard, share, toast, vibrate
            - White-on-black DeepSeek adaptive icon
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
