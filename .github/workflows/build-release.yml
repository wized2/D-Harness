name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/dharness-release.jks"
            echo "Keystore OK: $(wc -c < "$GITHUB_WORKSPACE/dharness-release.jks") bytes"
          else
            echo "WARNING: no keystore secret"
          fi

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -f "$GITHUB_WORKSPACE/dharness-release.jks" ]; then
            export RELEASE_STORE_FILE="$GITHUB_WORKSPACE/dharness-release.jks"
            echo "RELEASE_STORE_FILE=$RELEASE_STORE_FILE"
            echo "alias set: ${RELEASE_KEY_ALIAS:+yes}"
          else
            echo "WARNING: building without release keystore — will use debug sign"
          fi
          gradle :app:assembleRelease --no-daemon --stacktrace
          find app/build/outputs -name '*.apk' -ls

      - name: Read version
        id: ver
        run: |
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "tag=v$VN" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: |
          set -e
          mkdir -p dist
          SRC=$(find app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$SRC"
          echo "Using APK: $SRC"
          # Must be signed or install fails with "Package appears to be invalid"
          ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          AS=$(find "$ANDROID_HOME" -name apksigner 2>/dev/null | head -1 || true)
          if [ -z "$AS" ]; then
            # install cmdline tools if needed
            yes | sudo apt-get install -y apksigner 2>/dev/null || true
            AS=$(command -v apksigner || true)
          fi
          if [ -n "$AS" ]; then
            "$AS" verify --verbose "$SRC" || { echo "FATAL: APK not signed"; exit 1; }
          else
            # fallback jarsigner check
            jarsigner -verify "$SRC" | tee /tmp/jsig.txt
            grep -qi 'jar verified' /tmp/jsig.txt || { echo "FATAL: APK not signed"; unzip -l "$SRC" | head -30; exit 1; }
          fi
          cp "$SRC" "dist/D-Harness-${{ steps.ver.outputs.name }}.apk"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: D-Harness-release
          path: dist/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: D-Harness ${{ steps.ver.outputs.name }}
          body: |
            ## D-Harness ${{ steps.ver.outputs.name }} (signed)

            DeepSeek Chat WebView + **tool shim** + **native bridge**.

            ### Agent
            - Paste-ready system instructions in-app
            - `list_tools()` / `describe()` with examples — no guessing tool APIs
            - One JSON tool call per reply → `TOOL_RESULT:` → continue

            ### Stack
            - Shim: upstream dsh.js + native tools
            - Theme: Claude.js v3.1 (optional)
            - Logo: updated brand SVG

            ### Install
            Download **D-Harness-${{ steps.ver.outputs.name }}.apk** below.

            MIT

          files: dist/D-Harness-${{ steps.ver.outputs.name }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
